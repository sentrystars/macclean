name: MacClean
options:
  bundleIdPrefix: com.macclean
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_STRICT_CONCURRENCY: complete
  CODE_SIGN_STYLE: Automatic
  CODE_SIGN_IDENTITY: "-"
  DEVELOPMENT_TEAM: ""

targets:
  MacClean:
    type: application
    platform: macOS
    sources:
      - path: MacClean
    resources:
      - path: MacClean/Resources/AppIcon.icns
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.macclean.app
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_KEY_LSUIElement: "NO"
      INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 MacClean"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.1.0"
      INFOPLIST_KEY_CFBundleVersion: "2"
      ENABLE_HARDENED_RUNTIME: true
      CODE_SIGN_ENTITLEMENTS: MacClean/MacClean.entitlements
      SWIFT_VERSION: "6.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: MacClean/Info.plist
      properties:
        CFBundleName: MacClean
        CFBundleDisplayName: MacClean
        CFBundlePackageType: APPL
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        CFBundleDevelopmentRegion: zh_CN

  # 纯逻辑测试（策略/解析/格式化/进程），以命令行工具方式运行：
  #   xcodebuild -project MacClean.xcodeproj -scheme MacCleanTests build
  MacCleanTests:
    type: tool
    platform: macOS
    sources:
      - path: MacCleanTests
      - path: MacClean/Models
      - path: MacClean/Services
      - path: MacClean/Utilities
      - path: MacClean/Extensions
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.macclean.tests
      PRODUCT_NAME: MacCleanTests
      GENERATE_INFOPLIST_FILE: true
      SWIFT_VERSION: "6.0"
      MACH_O_TYPE: mh_execute
      SKIP_INSTALL: true
    scheme:
      testTargets: []
