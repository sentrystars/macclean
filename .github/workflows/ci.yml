name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 运行逻辑测试
        run: ./tools/run-tests.sh

      - name: 构建 App
        run: ./tools/build-app.sh Release

      - name: 校验 App Bundle
        run: |
          test -x build/restricted/MacClean.app/Contents/MacOS/MacClean
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/restricted/MacClean.app/Contents/Info.plist
